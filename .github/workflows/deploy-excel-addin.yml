name: Deploy Excel Receipt Add-in

on:
  push:
    branches:
      - main
    paths:
      - "excel-receipt-addin/**"
      - ".github/workflows/deploy-excel-addin.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: excel-receipt-addin/package-lock.json

      - name: Install dependencies
        working-directory: excel-receipt-addin
        run: npm ci

      - name: Typecheck
        working-directory: excel-receipt-addin
        run: npm run typecheck

      - name: Test
        working-directory: excel-receipt-addin
        run: npm test

      - name: Build
        working-directory: excel-receipt-addin
        env:
          GITHUB_PAGES: "true"
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: excel-receipt-addin/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
